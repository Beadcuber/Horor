name: Build Horror Mod
on:
  push:
    paths:
      - 'HorrorMod-Fabric-1.21.1-Source.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract mod source
        run: |
          test -f HorrorMod-Fabric-1.21.1-Source.zip || { echo "Upload HorrorMod-Fabric-1.21.1-Source.zip to the repository root."; exit 1; }
          unzip -q HorrorMod-Fabric-1.21.1-Source.zip -d source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Fix Minecraft 1.21.1 camera enum package
        working-directory: source/horrormod
        run: |
          sed -i 's/import net.minecraft.client.render.CameraSubmersionType;/import net.minecraft.block.enums.CameraSubmersionType;/' src/main/java/com/horrormod/mixin/BackgroundRendererMixin.java
      - name: Build Fabric mod
        working-directory: source/horrormod
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: horrormod-fabric-1.21.1
          path: source/horrormod/build/libs/*.jar
          if-no-files-found: error
